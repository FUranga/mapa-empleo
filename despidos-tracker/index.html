<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despidos y cierres · Visión Desarrollista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--panel:#ffffff;--ink:#1d1d1f;--muted:#86868b;
  --hair:#e6e6e8;--hair2:#f0f0f2;
  --loss:#d0342c;--gain:#1f6f5c;--neutral:#eef0f0;--nodata:#f4f4f5;
  --accent:#0071e3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  font-size:14px;line-height:1.47;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.wrap{max-width:1320px;margin:0 auto;padding:26px 28px 48px}
a{color:inherit}

header{margin-bottom:20px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
h1{font-weight:800;font-size:38px;line-height:1.05;letter-spacing:-.03em;max-width:26ch}
.sub{color:var(--muted);margin-top:10px;max-width:66ch;font-size:14px;font-weight:400}

.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  margin:18px 0 0;padding-bottom:16px;border-bottom:1px solid var(--hair)}
.ctl-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-right:2px}
select, input[type=text]{
  font:inherit;font-size:13px;font-weight:500;color:var(--ink);
  background:#f5f5f7;border:none;border-radius:10px;padding:8px 12px;
}
input[type=text]{min-width:220px;flex:1}
select:focus, input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.crumb{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:700}

main{padding-top:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr)} h1{font-size:30px}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:18px 20px;
  display:flex;flex-direction:column}

.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:980px;background:#f5f5f7;color:var(--muted);margin-bottom:10px}
.badge.topic-despidos{background:#e6f1fa;color:#2f6690}
.badge.topic-cierres{background:#f2ecf9;color:#7c5aa6}

.dateline{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
.dateline b{color:var(--ink);font-weight:600}

.card h2{font-weight:700;font-size:16.5px;letter-spacing:-.015em;line-height:1.32;margin-bottom:8px}
.card h2 a{text-decoration:none}
.card h2 a:hover{text-decoration:underline}

.snippet{font-size:13px;color:var(--muted);line-height:1.5;font-weight:400;flex:1;margin-bottom:12px}


.empty{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--muted);font-size:15px}

.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:32px}
.pager button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:#f5f5f7;
  border:none;border-radius:980px;padding:8px 18px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.pager button:hover:not(:disabled){opacity:.7}
.pager-label{font-size:12.5px;color:var(--muted);font-weight:500}

footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--hair);
  font-size:12px;color:var(--muted);line-height:1.7;font-weight:400}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Últimas noticias sobre despidos y cierres de empresas</h1>

  <div class="controls">
    <span class="ctl-label">Provincia</span>
    <select id="filterProvincia"><option value="">Todas</option></select>
    <span class="ctl-label">Ciudad</span>
    <select id="filterDepartamento"><option value="">Todas</option></select>
    <input id="search" type="text" placeholder="Buscar...">
  </div>
</header>

<main>
  <div id="list" class="grid"></div>
  <div id="pager" class="pager"></div>
</main>
</div>

<script>
let allItems = [];
const PAGE_SIZE = 30;
let currentPage = 1;

async function loadData(){
  try{
    const res = await fetch('data/curated_data.json', {cache:'no-store'});
    allItems = await res.json();
  }catch(e){
    allItems = [];
  }
  allItems.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  populateFilters();
  render();
}

function populateFilters(){
  const provincias = [...new Set(allItems.map(i => i.provincia).filter(Boolean))].sort();
  const provSel = document.getElementById('filterProvincia');
  provincias.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    provSel.appendChild(opt);
  });
  provSel.addEventListener('change', () => { currentPage = 1; updateDepartamentos(); render(); });
  document.getElementById('filterDepartamento').addEventListener('change', () => { currentPage = 1; render(); });
  document.getElementById('search').addEventListener('input', () => { currentPage = 1; render(); });
}

function updateDepartamentos(){
  const provincia = document.getElementById('filterProvincia').value;
  const depSel = document.getElementById('filterDepartamento');
  depSel.innerHTML = '<option value="">Todas</option>';
  const deps = [...new Set(
    allItems.filter(i => !provincia || i.provincia === provincia)
            .map(i => i.departamento).filter(Boolean)
  )].sort();
  deps.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    depSel.appendChild(opt);
  });
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'short', year:'numeric'});
}

function topicLabel(t){
  if(t === 'despidos') return 'Despidos';
  if(t === 'cierres') return 'Cierre / quiebra';
  return 'Nacional';
}

function stripHtml(html){
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
}

function cleanTitle(title, medio){
  let t = (title || '').trim();
  if(medio){
    // saca sufijos tipo "Titulo - Medio" o "Titulo | Medio" que vienen de Google News
    const re = new RegExp(`\\s*[-|–]\\s*${medio.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*$`, 'i');
    t = t.replace(re, '').trim();
  }
  return t;
}

function render(){
  const provincia = document.getElementById('filterProvincia').value;
  const departamento = document.getElementById('filterDepartamento').value;
  const q = document.getElementById('search').value.trim().toLowerCase();

  const filtered = allItems.filter(i => {
    if(provincia && i.provincia !== provincia) return false;
    if(departamento && i.departamento !== departamento) return false;
    if(q && !(`${i.title} ${i.snippet}`.toLowerCase().includes(q))) return false;
    return true;
  });

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  const pageItems = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

  const list = document.getElementById('list');
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">Todavía no hay noticias publicadas para este filtro.</div>';
    renderPager(0);
    return;
  }

  list.innerHTML = pageItems.map(i => `
    <article class="card">
      <span class="badge topic-${i.topic || 'neutral'}">${topicLabel(i.topic)}</span>
      <div class="dateline"><b>${escapeHtml(i.medio || 'Fuente desconocida')}</b>${i.provincia ? ` — ${escapeHtml(i.provincia)}` : ''} · ${fmtDate(i.date)}</div>
      <h2><a href="${i.url}" target="_blank" rel="noopener">${escapeHtml(cleanTitle(i.title, i.medio))}</a></h2>
      ${i.snippet ? `<p class="snippet">${escapeHtml(stripHtml(i.snippet))}</p>` : ''}
    </article>
  `).join('');
  renderPager(totalPages);
}

function renderPager(totalPages){
  const pager = document.getElementById('pager');
  if(!pager) return;
  if(totalPages <= 1){ pager.innerHTML = ''; return; }
  let html = '';
  html += `<button ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">← Anterior</button>`;
  html += `<span class="pager-label">Página ${currentPage} de ${totalPages}</span>`;
  html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">Siguiente →</button>`;
  pager.innerHTML = html;
  pager.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      currentPage = parseInt(b.dataset.page, 10);
      render();
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

loadData();
</script>
</body>
</html>
