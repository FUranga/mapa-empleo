name: Actualizar datos del dashboard

on:
  schedule:
    # Corre todos los días a las 9am Argentina (UTC-3) = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:  # permite correrlo manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Verificar y actualizar datos
        run: python scripts/actualizar.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json empresas.json log.json
          git diff --staged --quiet || git commit -m "datos: actualización automática $(date +'%Y-%m-%d')"
          git push
