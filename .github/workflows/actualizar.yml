name: Actualizar datos del dashboard

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'departamento_series_empleo_y_salarios_mensual_sector_1.csv'
      - 'departamento_serie_empleo_remuneraciones_3.xlsx'
      - 'provinciales_serie_empleo_trimestral_2dig_6.xlsx'

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests openpyxl

      - name: Backup de JSONs actuales
        run: |
          cp data.json data.json.bak 2>/dev/null || true
          cp empresas.json empresas.json.bak 2>/dev/null || true
          echo "✓ Backups creados"

      - name: Verificar y actualizar datos
        run: python scripts/actualizar.py

      - name: Commit y push si hubo cambios
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json empresas.json log.json data.json.bak empresas.json.bak
          if git diff --staged --quiet; then
            echo "Sin cambios para commitear"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "datos: actualización automática $(date +'%Y-%m-%d')"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Leer log para el mail
        id: readlog
        if: steps.commit.outputs.committed == 'true'
        run: |
          python3 -c "
          import json
          with open('log.json') as f:
              log = json.load(f)
          msg = []
          if log.get('srt_last_update'):
              msg.append('Empresas (SRT): actualizado al ' + log['srt_last_update'])
          if log.get('oede_last_update'):
              msg.append('Empleo (OEDE/SIPA): actualizado al ' + log['oede_last_update'])
          print('\n'.join(msg) if msg else 'Datos actualizados')
          " > mail_body.txt
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat mail_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Mail — datos actualizados automáticamente
        if: steps.commit.outputs.committed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: franciscocuranga@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "Dashboard Argentina — datos actualizados"
          to: franciscocuranga@gmail.com
          from: Dashboard Argentina <franciscocuranga@gmail.com>
          body: |
            Se encontraron y procesaron datos nuevos en el dashboard.

            ${{ steps.readlog.outputs.body }}

            Ver cambios: https://github.com/FUranga/mapa-empleo/commits/main
            Ver dashboard: https://soft-cocada-6a8c87.netlify.app

      - name: Verificar alertas
        id: check_alerts
        run: |
          python3 -c "
          import json
          with open('log.json') as f:
              log = json.load(f)
          alerts = []
          # URL no encontrada o cambio inesperado
          if log.get('sipa_url_missing'):
              alerts.append('SIPA mensual: URL no encontrada en pagina del gobierno (el patron puede haber cambiado). Fecha: ' + log.get('sipa_url_missing_date',''))
          if log.get('xlsx_dept_web_missing'):
              alerts.append('XLSX departamental: URL no encontrada en pagina OEDE. Fecha: ' + log.get('xlsx_dept_web_missing_date',''))
          if log.get('xlsx_trim_web_missing'):
              alerts.append('XLSX trimestral provincial: URL no encontrada en pagina OEDE. Fecha: ' + log.get('xlsx_trim_web_missing_date',''))
          # Nuevos archivos detectados en web
          updates = []
          if log.get('xlsx_dept_needs_manual_update'):
              updates.append('XLSX departamental nuevo: ' + log.get('xlsx_dept_web_url',''))
          if log.get('xlsx_trim_needs_manual_update'):
              updates.append('XLSX trimestral provincial nuevo: ' + log.get('xlsx_trim_web_url',''))
          import sys
          if alerts:
              print('has_alerts=true', file=open('/tmp/alert_type.txt','w'))
              print('
'.join(alerts), file=open('/tmp/alert_body.txt','w'))
          elif updates:
              print('has_updates=true', file=open('/tmp/alert_type.txt','w'))
              print('
'.join(updates), file=open('/tmp/alert_body.txt','w'))
          else:
              print('nothing', file=open('/tmp/alert_type.txt','w'))
          "
          echo "alert_type=$(cat /tmp/alert_type.txt | head -1)" >> $GITHUB_OUTPUT
          echo "alert_body<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/alert_body.txt >> $GITHUB_OUTPUT || true
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Mail — alerta URL no encontrada
        if: contains(steps.check_alerts.outputs.alert_type, 'has_alerts')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: franciscocuranga@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "Dashboard Argentina — ALERTA: URL de fuente no encontrada"
          to: franciscocuranga@gmail.com
          from: Dashboard Argentina <franciscocuranga@gmail.com>
          body: |
            El workflow fue a buscar un archivo y no encontró la URL esperada.
            El gobierno puede haber cambiado la ubicación o el nombre del archivo.

            ${{ steps.check_alerts.outputs.alert_body }}

            Revisá manualmente las páginas fuente:
            - SIPA: https://www.argentina.gob.ar/trabajo/estadisticas/situacion-y-evolucion-del-trabajo-registrado
            - OEDE: https://www.argentina.gob.ar/trabajo/estadisticas/oede-estadisticas-provinciales

            Ver workflow: https://github.com/FUranga/mapa-empleo/actions

      - name: Mail — nuevos archivos OEDE detectados
        if: contains(steps.check_alerts.outputs.alert_type, 'has_updates')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: franciscocuranga@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "Dashboard Argentina — nuevos archivos OEDE disponibles"
          to: franciscocuranga@gmail.com
          from: Dashboard Argentina <franciscocuranga@gmail.com>
          body: |
            El OEDE publicó nuevos archivos. Bajálos y subílos al repo para actualizar el dashboard.

            ${{ steps.check_alerts.outputs.alert_body }}

            Pasos:
            1. Bajá los archivos desde las URLs indicadas arriba
            2. Subílos al repo con el nombre actual (reemplazando el anterior)
            3. El workflow se dispara automáticamente y regenera data.json

            Ver repo: https://github.com/FUranga/mapa-empleo

      - name: Verificar si OEDE departamental necesita actualización manual
        id: check_dept
        run: |
          python3 -c "
          import json
          with open('log.json') as f:
              log = json.load(f)
          needs = log.get('dept_needs_manual_update', False)
          detected = log.get('dept_last_detected', '')
          print('needs=' + str(needs).lower())
          print('detected=' + detected)
          " > dept_check.txt
          grep "needs=true" dept_check.txt && echo "needs_update=true" >> $GITHUB_OUTPUT || echo "needs_update=false" >> $GITHUB_OUTPUT
          grep "detected=" dept_check.txt | cut -d= -f2 > dept_date.txt
          echo "detected=$(cat dept_date.txt)" >> $GITHUB_OUTPUT

      - name: Mail — actualización manual requerida (departamental)
        if: steps.check_dept.outputs.needs_update == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: franciscocuranga@gmail.com
          password: ${{ secrets.GMAIL_PASSWORD }}
          subject: "Dashboard Argentina — acción requerida: CSV departamental actualizado"
          to: franciscocuranga@gmail.com
          from: Dashboard Argentina <franciscocuranga@gmail.com>
          body: |
            El OEDE publicó una versión nueva del CSV departamental de empleo.

            Fecha de detección: ${{ steps.check_dept.outputs.detected }}

            Este archivo requiere actualización manual:
            1. Bajá el nuevo CSV desde:
               https://www.argentina.gob.ar/trabajo/estadisticas/oede-estadisticas-provinciales
            2. Reemplazalo en el repo como:
               departamento_series_empleo_y_salarios_mensual_sector_1.csv
            3. El workflow detectará el cambio y regenerará data.json automáticamente.

            Ver repo: https://github.com/FUranga/mapa-empleo
